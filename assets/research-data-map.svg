<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Open summary data, connected research questions</title>
  <desc id="desc">Original conceptual illustration showing public GWAS summary statistics linked with retinal imaging, lipid and metabolite profiles, protein and multi-omics, and cardiovascular outcomes. Lines represent possible cross-study analyses, not causal findings or a shared participant cohort.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#ecf6f2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8879"/>
      <stop offset="1" stop-color="#df5262"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48c8b6"/>
      <stop offset="1" stop-color="#168a91"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6daaff"/>
      <stop offset="1" stop-color="#4168d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd67c"/>
      <stop offset="1" stop-color="#ed9b3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#153958" flood-opacity="0.12"/>
    </filter>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.2" fill="#66839e"/>
    </marker>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1170" cy="72" r="130" fill="#dff2ef" opacity=".7"/>
  <circle cx="86" cy="457" r="95" fill="#e2edff" opacity=".62"/>
  <path d="M315 260 C405 260 405 260 472 260 M808 260 C875 260 875 260 965 260 M520 215 C480 155 460 145 400 145 M760 215 C815 155 840 145 900 145 M520 305 C480 360 460 374 400 374 M760 305 C815 360 840 374 900 374" fill="none" stroke="#8ca8bc" stroke-width="3" stroke-dasharray="7 9" marker-start="url(#dot)" marker-end="url(#dot)" opacity=".8"/>

  <text x="64" y="67" fill="#183653" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750">Open data. Connected questions.</text>
  <text x="65" y="101" fill="#536e87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A growing, source-linked map for summary-level biomedical research</text>

  <g filter="url(#shadow)">
    <rect x="481" y="184" width="318" height="152" rx="28" fill="url(#panel)" stroke="#dbe8f0" stroke-width="2"/>
  </g>
  <circle cx="640" cy="228" r="25" fill="#e6f0fb"/>
  <path d="M626 228h28M640 214v28M630 218l20 20M650 218l-20 20" stroke="#4168d9" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="640" cy="228" r="3.5" fill="#ed9b3f"/>
  <text x="640" y="276" text-anchor="middle" fill="#1d3c5b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="720">GWAS summary data</text>
  <text x="640" y="302" text-anchor="middle" fill="#647c91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">variants · traits · study-specific cohorts</text>

  <g filter="url(#shadow)">
    <rect x="65" y="119" width="340" height="102" rx="22" fill="url(#panel)" stroke="#dce9f2" stroke-width="2"/>
  </g>
  <circle cx="119" cy="170" r="32" fill="#fff0ee"/>
  <path d="M91 170c8-12 18-18 28-18s20 6 28 18c-8 12-18 18-28 18s-20-6-28-18Z" fill="none" stroke="url(#coral)" stroke-width="4"/>
  <circle cx="119" cy="170" r="8" fill="url(#coral)"/>
  <circle cx="119" cy="170" r="3" fill="#fff"/>
  <text x="169" y="164" fill="#213d58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="720">Retinal imaging</text>
  <text x="169" y="190" fill="#667f95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">OCT layers · spatial traits · fundus vessels</text>

  <g filter="url(#shadow)">
    <rect x="875" y="119" width="340" height="102" rx="22" fill="url(#panel)" stroke="#dce9f2" stroke-width="2"/>
  </g>
  <circle cx="929" cy="170" r="32" fill="#fff6e8"/>
  <path d="M929 146c-7 12-14 19-14 28a14 14 0 0 0 28 0c0-9-7-16-14-28Z" fill="url(#gold)"/>
  <circle cx="929" cy="176" r="4" fill="#fff5dc"/>
  <text x="979" y="164" fill="#213d58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="720">Lipids &amp; metabolites</text>
  <text x="979" y="190" fill="#667f95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">NMR profiles · molecular lipid species</text>

  <g filter="url(#shadow)">
    <rect x="65" y="323" width="340" height="102" rx="22" fill="url(#panel)" stroke="#dce9f2" stroke-width="2"/>
  </g>
  <circle cx="119" cy="374" r="32" fill="#e9f8f5"/>
  <path d="M108 355c22 0 22 38 0 38M130 355c-22 0-22 38 0 38M109 361h20M107 370h24M109 379h20M111 388h16" fill="none" stroke="url(#teal)" stroke-width="2.8" stroke-linecap="round"/>
  <text x="169" y="368" fill="#213d58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="720">Proteins &amp; multi-omics</text>
  <text x="169" y="394" fill="#667f95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">pQTLs · molecular layers · shared loci</text>

  <g filter="url(#shadow)">
    <rect x="875" y="323" width="340" height="102" rx="22" fill="url(#panel)" stroke="#dce9f2" stroke-width="2"/>
  </g>
  <circle cx="929" cy="374" r="32" fill="#edf1ff"/>
  <path d="M929 393s-22-13-22-28c0-10 13-14 22-3 9-11 22-7 22 3 0 15-22 28-22 28Z" fill="url(#blue)"/>
  <path d="M914 373h10l4-8 6 18 4-10h7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="979" y="368" fill="#213d58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="720">AMD &amp; vascular outcomes</text>
  <text x="979" y="394" fill="#667f95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">FinnGen · aortic stenosis · CHD</text>

  <rect x="439" y="431" width="402" height="37" rx="18.5" fill="#173f62"/>
  <text x="640" y="456" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">Cross-study evidence · transparent limits · reproducible links</text>
  <text x="640" y="495" text-anchor="middle" fill="#536e87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Conceptual map: connections are research questions, not causal findings or one linked cohort.</text>
</svg>

